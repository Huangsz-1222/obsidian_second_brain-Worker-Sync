#:schema node_modules/wrangler/config-schema.json
name = "obsidian-clipping-worker"
main = "src/index.ts"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]

# 非機密的環境變數放這裡
[vars]
GITHUB_REPO = "Huangsz-1222/Second-Brain"
GITHUB_BRANCH = "main"
OBSIDIAN_SAVE_PATH = "Clippings_github"

# 機密憑證請用指令設定（不要寫在這裡）：
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put JINA_API_KEY        # 選用，避免 Jina 限速
#   npx wrangler secret put ADMIN_CHAT_ID       # 瀏覽器/PWA 分享後通知用
#   npx wrangler secret put BROWSER_SECRET      # 瀏覽器擴充功能驗證


